version: '3.8'

services:
  framegenx-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./runs:/app/runs
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONUNBUFFERED=1
